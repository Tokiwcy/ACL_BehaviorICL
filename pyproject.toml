[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionicl"
version = "0.2.0"
description = "DecisionICL: target-model decision factors for visual demonstration retrieval"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "Pillow>=10"]

[project.optional-dependencies]
models = ["torch>=2.6,<3", "transformers>=5.14,<6", "accelerate>=1", "qwen-vl-utils>=0.0.14"]
quantization = ["bitsandbytes>=0.49"]
test = ["pytest>=8"]

[project.scripts]
decisionicl = "decisionicl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

